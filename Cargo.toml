[package]
name = "klause"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "TODO: one-sentence description of the Klause library."
license = "MIT"
repository = "https://github.com/aridinstitute/klause"
readme = "README.md"

# The examples/ and tests/ directories hold API sketches that don't compile
# yet, so cargo must not build them as targets.
autoexamples = false
autotests = false

