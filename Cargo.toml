[package]
name = "klause"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "TODO: one-sentence description of the Klause library."
license = "MIT"
repository = "https://github.com/aridinstitute/klause"
readme = "README.md"

# Opt in to targets as the API sketches are turned into compiling code.
autoexamples = false
autotests = false

# TODO: Add keywords (at most 5, each 20 characters or fewer) and categories
# before publishing to crates.io. See <https://crates.io/category_slugs>.
# keywords = [""]
# categories = [""]

[features]
default = ["std"]
std = []

[dependencies]
unicode-general-category = "1.1"
unicode-normalization = { version = "0.1", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[test]]
name = "document"

[[test]]
name = "annotating"

[[test]]
name = "selecting"

[[test]]
name = "passages"

[[test]]
name = "querying"

[[test]]
name = "sources"

[[test]]
name = "bible"

[[bench]]
name = "document_creation"
harness = false

[[bench]]
name = "spans"
harness = false

[[bench]]
name = "filtering"
harness = false
