[package]
name = "klause"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Store, render, and query annotated text in memory."
license = "MIT"
repository = "https://github.com/aridinstitute/klause"
readme = "README.md"

# Explicit targets keep the examples and integration test suites intentional.
autoexamples = false
autotests = false

keywords = ["text", "annotations", "corpus"]
categories = ["text-processing"]

[features]
default = ["std"]
std = []

[dependencies]
spin = { version = "0.10", default-features = false, features = ["once"] }
unicode-general-category = "1.1"
unicode-normalization = { version = "0.1", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "document"

[[test]]
name = "annotating"

[[test]]
name = "selecting"

[[test]]
name = "passages"

[[test]]
name = "querying"

[[test]]
name = "sources"

[[test]]
name = "bible"

[[test]]
name = "corpus"

[[example]]
name = "corpus"

[[example]]
name = "quickstart"

[[test]]
name = "bsb_usj"

[[bench]]
name = "bsb_usj"
harness = false

[[bench]]
name = "document_creation"
harness = false

[[bench]]
name = "spans"
harness = false

[[bench]]
name = "filtering"
harness = false

[[bench]]
name = "planning"
harness = false

[[bench]]
name = "corpus"
harness = false

[[bench]]
name = "bible_workload"
harness = false
